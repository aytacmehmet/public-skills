specVersion: "4.0"
metadata:
  name: __APP_ID__
type: application
framework:
  name: SAPUI5
  version: "__UI5_VERSION__"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        transformTypeScript: true
        transformModulesToUI5: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
        transformModulesToUI5: true

name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r .github/requirements.txt
      - name: Test version and archive behavior
        run: python -B -m unittest discover -s .github/tests -v
      - name: Test English SAP documentation behavior
        run: python -B en/sap-development-documentation/scripts/test_vault.py
      - name: Test Turkish SAP documentation behavior
        run: python -B tr/sap-gelistirme-dokumantasyonu/scripts/test_vault.py
      - name: Validate packages and release history
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REVISION" ] && [ "$BASE_REVISION" != "0000000000000000000000000000000000000000" ]; then
            python -B .github/scripts/skills.py validate --base "$BASE_REVISION"
          else
            python -B .github/scripts/skills.py validate
          fi

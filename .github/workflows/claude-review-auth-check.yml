name: Claude review authentication check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        model: [claude-sonnet-5, claude-sonnet-5-5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the same official Claude runtime as the failed review
        run: |
          curl -fsSL https://claude.ai/install.sh -o "$RUNNER_TEMP/claude-install.sh"
          bash "$RUNNER_TEMP/claude-install.sh" 2.1.286
      - name: Test the existing repository credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REQUESTED_MODEL: ${{ matrix.model }}
        run: |
          set +e
          "$HOME/.local/bin/claude" -p 'Reply with exactly AUTH_CHECK_OK. Do not use tools or access repository files.' --model "$REQUESTED_MODEL" --tools "" --max-turns 2 --output-format stream-json --verbose > "$RUNNER_TEMP/auth-execution.jsonl" 2> "$RUNNER_TEMP/auth-stderr.log"
          exit 0
      - name: Classify the execution without exposing raw output
        if: always()
        env:
          REQUESTED_MODEL: ${{ matrix.model }}
        run: |
          python -B .github/scripts/claude_execution_summary.py --execution-file "$RUNNER_TEMP/auth-execution.jsonl" --model "$REQUESTED_MODEL" --expect AUTH_CHECK_OK --output "$RUNNER_TEMP/auth-summary.json"
      - name: Retain the bounded diagnostic summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-summary-${{ matrix.model }}
          path: ${{ runner.temp }}/auth-summary.json
          retention-days: 3
          if-no-files-found: error

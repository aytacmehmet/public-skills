name: Belirtim Yazmani runtime
on:
  push:
    branches: [main]
    paths:
      - 'plugins/belirtim-yazmani/**'
      - '.github/workflows/belirtim-yazmani.yml'
  pull_request:
    paths:
      - 'plugins/belirtim-yazmani/**'
      - '.github/workflows/belirtim-yazmani.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: plugins/belirtim-yazmani
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned plugin dependencies
        run: python -m pip install -r plugins/belirtim-yazmani/requirements.txt
      - name: Typed handoff, migration and rejection controls
        run: python -B -m unittest discover -s plugins/belirtim-yazmani/tests -v
      - name: Validate complete plugin and codec pin
        run: python -B plugins/belirtim-yazmani/skills/belirtim-yazmani/scripts/check_package.py
      - name: Verify reproducible offline distribution
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys, tempfile
          root = pathlib.Path('plugins/belirtim-yazmani')
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as temp:
              subprocess.run([sys.executable, '-B', str(root / 'scripts/build_package.py'), '--output-dir', temp], check=True)
              assert (root / 'PACKAGE-MANIFEST.json').read_bytes() == (pathlib.Path(temp) / 'PACKAGE-MANIFEST.json').read_bytes()

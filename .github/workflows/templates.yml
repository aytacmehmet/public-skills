name: Verify SAP Fiori templates

on:
  push:
    branches: [main]
    paths:
      - 'en/sap-fiori-design/assets/**'
      - 'en/sap-fiori-design/scripts/**'
      - '.github/workflows/templates.yml'
  pull_request:
    paths:
      - 'en/sap-fiori-design/assets/**'
      - 'en/sap-fiori-design/scripts/**'
      - '.github/workflows/templates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Turkish package carries byte-identical assets (guarded by .github/tests), so one package is built.
  template:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [freestyle-sapui5, fiori-elements-odata-v4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Pin to a commit SHA like the actions above once the maintainer has reviewed the release.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scaffold the production app
        run: >
          python -B en/sap-fiori-design/scripts/scaffold_fiori_workspace.py "$RUNNER_TEMP/delivery"
          --app-id com.acme.orders --name Orders --language en --output code
          --framework ${{ matrix.framework }} --ui5-version 1.151.0
          --service-uri /sap/opu/odata4/orders/ --entity-set Orders --semantic-object SalesOrder
      - name: Install the pinned dependencies
        working-directory: ${{ runner.temp }}/delivery/app
        run: npm ci --no-audit --no-fund
      - name: Static gates
        working-directory: ${{ runner.temp }}/delivery/app
        run: |
          npm run lint
          npm run --if-present typecheck
          npm run --if-present validate:manifest
          npm run build
      - name: Browser tests
        working-directory: ${{ runner.temp }}/delivery/app
        run: |
          npx playwright install --with-deps chromium
          npm run --if-present test:unit
          npm run test:integration

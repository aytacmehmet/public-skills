name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    env:
      CLAUDE_REVIEW_AUTH_MODE: ${{ vars.CLAUDE_REVIEW_AUTH_MODE || 'oauth' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate the explicitly selected authentication mode
        env:
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          case "$CLAUDE_REVIEW_AUTH_MODE" in
            oauth)
              if [ "$HAS_OAUTH_TOKEN" != "true" ]; then
                echo "::error::CLAUDE_CODE_OAUTH_TOKEN is missing for OAuth review mode."
                exit 1
              fi
              ;;
            api)
              if [ "$HAS_API_KEY" != "true" ]; then
                echo "::error::ANTHROPIC_API_KEY is missing for explicitly selected API mode."
                exit 1
              fi
              ;;
            *)
              echo "::error::CLAUDE_REVIEW_AUTH_MODE must be oauth or api."
              exit 1
              ;;
          esac

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # API mode is an explicit repository-owner choice; OAuth remains the default.
          claude_code_oauth_token: ${{ vars.CLAUDE_REVIEW_AUTH_MODE != 'api' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ vars.CLAUDE_REVIEW_AUTH_MODE == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Explain failed Claude execution
        if: ${{ failure() && steps.claude-review.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          python -B .github/scripts/claude_execution_summary.py --execution-file "$EXECUTION_FILE" --model default --output "$RUNNER_TEMP/claude-review-summary.json"

      - name: Retain the bounded failure summary
        if: ${{ failure() && steps.claude-review.outputs.execution_file != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-review-failure
          path: ${{ runner.temp }}/claude-review-summary.json
          retention-days: 7
          if-no-files-found: error


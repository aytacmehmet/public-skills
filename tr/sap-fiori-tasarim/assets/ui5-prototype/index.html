<!doctype html>
<html lang="__LANGUAGE__" data-height="100%">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAP Fiori Interactive Prototype</title>
    <link rel="stylesheet" href="css/app.css">
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/__UI5_VERSION__/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
      data-sap-ui-async="true"
      data-sap-ui-compat-version="edge"
      data-sap-ui-resource-roots='{"__APP_ID__":"./"}'
    ></script>
  </head>
  <body class="sapUiBody" id="content">
    <div
      class="appHost"
      data-sap-ui-component
      data-name="__APP_ID__"
      data-id="prototypeContainer"
      data-height="100%"
      data-settings='{"id":"__APP_ID__"}'
    ></div>
  </body>
</html>
